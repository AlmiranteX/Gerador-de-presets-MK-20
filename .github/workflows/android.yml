name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Apagar gradlew antigo se existir
        run: rm -f gradlew

      - name: Criar Gradle Wrapper Oficial no Linux
        run: gradle wrapper --gradle-version 9.3.1

      - name: Dar permissao de execucao
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug -x test --no-daemon --stacktrace

      - name: Upload do APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: MK20-Tone-Generator-APK
          path: '**/*.apk'
