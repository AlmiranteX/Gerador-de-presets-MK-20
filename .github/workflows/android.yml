name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar e Executar Build com Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-scan-publish: false

      - name: Compilar APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            find . -name gradlew -exec chmod +x {} \;
            find . -name gradlew -execdir ./gradlew assembleDebug --no-daemon \;
          fi

      - name: Upload do APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: MK20-Tone-Generator-APK
          path: '**/build/outputs/apk/debug/*.apk'
