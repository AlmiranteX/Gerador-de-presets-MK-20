name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar APK
        run: |
          # Procura o arquivo gradlew em qualquer subpasta do repositorio
          GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Erro: Arquivo gradlew nao encontrado no repositorio."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Projeto encontrado na pasta: $PROJECT_DIR"
          
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload do APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: MK20-Tone-Generator-APK
          path: '**/build/outputs/apk/debug/*.apk'
