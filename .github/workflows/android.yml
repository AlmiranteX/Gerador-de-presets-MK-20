name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gerar Wrapper do Gradle Compativel
        run: |
          gradle wrapper --gradle-version 8.8
          chmod +x gradlew

      - name: Injetar Repositorios Maven e Google
        run: |
          # Procura onde esta o arquivo settings.gradle ou settings.gradle.kts para garantir os repositorios
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            echo "Adicionando repositorios ao $SETTINGS_FILE"
            echo "" >> "$SETTINGS_FILE"
            echo "dependencyResolutionManagement {" >> "$SETTINGS_FILE"
            echo "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)" >> "$SETTINGS_FILE"
            echo "    repositories {" >> "$SETTINGS_FILE"
            echo "        google()" >> "$SETTINGS_FILE"
            echo "        mavenCentral()" >> "$SETTINGS_FILE"
            echo "    }" >> "$SETTINGS_FILE"
            echo "}" >> "$SETTINGS_FILE"
          fi

      - name: Compilar APK com Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload do APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: MK20-Tone-Generator-APK
          path: '**/build/outputs/apk/debug/*.apk'
